name: testa
# Development: the database only. Backend: `cd server && ./mvnw spring-boot:run`; frontend: `cd testa && npm run dev`.
# For production use docker-compose.prod.yml; see docs/deployment.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testa
      POSTGRES_USER: testa
      POSTGRES_PASSWORD: ${TESTA_DB_PASSWORD:-testa-dev}
    ports:
      - "127.0.0.1:${TESTA_DB_PORT:-5432}:5432"
    volumes:
      - testa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testa -d testa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  testa-db:
