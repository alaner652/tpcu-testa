name: Refresh media

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Media to regenerate
        required: true
        type: choice
        default: screenshots
        options:
          - screenshots
          - videos
          - all
      commit:
        description: Commit generated files back to the selected branch
        required: true
        type: boolean
        default: false

concurrency:
  group: refresh-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Render media in an isolated demo stack
        run: ./deploy/render-media.sh "${{ inputs.kind }}"
      - name: Upload screenshots
        if: inputs.kind != 'videos'
        uses: actions/upload-artifact@v4
        with:
          name: testa-screenshots-${{ github.run_number }}
          path: docs/images/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload manual videos
        if: inputs.kind != 'screenshots'
        uses: actions/upload-artifact@v4
        with:
          name: testa-videos-${{ github.run_number }}
          path: testa/public/manual/*.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated files
        if: inputs.commit && github.ref == 'refs/heads/main'
        run: |
          git add docs/images testa/public/manual
          if git diff --cached --quiet; then
            echo "Generated media is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh generated media"
          git push
