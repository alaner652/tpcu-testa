spring:
  application:
    name: testa-server
  datasource:
    url: ${TESTA_DB_URL:jdbc:postgresql://localhost:5432/testa}
    username: ${TESTA_DB_USER:testa}
    password: ${TESTA_DB_PASSWORD:testa-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      # Tables are created by Flyway (V6)
      initialize-schema: never

server:
  port: ${TESTA_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: TESTA_SESSION
        http-only: true
        same-site: lax
        # Production runs behind HTTPS: set TESTA_COOKIE_SECURE=true
        secure: ${TESTA_COOKIE_SECURE:false}
  forward-headers-strategy: native

testa:
  login:
    max-failures: 5
    lock-minutes: 15
    # Staff sign-in expires after this long without activity (adjustable in System settings)
    idle-minutes: 480
  # The dump directory stays read-only to the backend. A separate control directory lets administrators request a backup.
  backup-dir: ${TESTA_BACKUP_PATH:}
  backup-control-dir: ${TESTA_BACKUP_CONTROL_PATH:}
  backup-keep-days: ${TESTA_BACKUP_KEEP_DAYS:30}
  grading:
    # Warn the officer when graders differ by more than this share of the question's points.
    # The school's rule is "gap over 20", read here as 20% of the points (20 on a 100-point question)
    flag-ratio: 0.2
  ai:
    # AI question import: presets for what administrators set in the admin pages (System settings).
    # An OpenAI-compatible endpoint such as a local llama-server, e.g. http://10.0.0.5:8090
    base-url: ${TESTA_AI_URL:}
    model: ${TESTA_AI_MODEL:}
    api-key: ${TESTA_AI_KEY:}
  retention:
    # Exam data is kept until the end of (year the exam ended + this many years), Taipei time; after that archived exams can be deleted by hand
    years: 1
