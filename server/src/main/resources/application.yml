spring:
  application:
    name: testa-server
  datasource:
    url: ${TESTA_DB_URL:jdbc:postgresql://localhost:5432/testa}
    username: ${TESTA_DB_USER:testa}
    password: ${TESTA_DB_PASSWORD:testa-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      # 資料表由 Flyway 建立（V6）
      initialize-schema: never

server:
  port: ${TESTA_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: TESTA_SESSION
        http-only: true
        same-site: lax
        # 正式環境走 HTTPS，設 TESTA_COOKIE_SECURE=true
        secure: ${TESTA_COOKIE_SECURE:false}
  forward-headers-strategy: native

testa:
  # 第一次啟動且資料庫裡沒有任何系統管理員時，用這組帳密建立一位。
  bootstrap-admin:
    email: ${TESTA_ADMIN_EMAIL:}
    password: ${TESTA_ADMIN_PASSWORD:}
    name: ${TESTA_ADMIN_NAME:系統管理員}
  login:
    max-failures: 5
    lock-minutes: 15
  # 備份檔所在的資料夾（唯讀）。有設定的話，後台會列出備份檔讓系統管理員確認每天的備份有在跑。
  backup-dir: ${TESTA_BACKUP_PATH:}
  grading:
    # 評分者之間的差距超過該題配分的這個比例，就警示承辦人。
    # 學校的規則是「差距 > 20」；這裡換算成配分的 20%（100 分的題目就是 20 分）
    flag-ratio: 0.2
  retention:
    # 考試資料保留到「考試結束那一年 + 這個年數」的年底（台北時間），之後封存的考試才能人工刪除
    years: 1
