# HTTPS terminated by this deployment (used by deploy/https.yml instead of nginx.conf).
# Certificate files: $TESTA_TLS_DIR/fullchain.pem and $TESTA_TLS_DIR/privkey.pem.
# After replacing them, restart the web container.
#
# No HSTS header on purpose: if the certificate fails on an exam day, falling back to plain HTTP on the
# internal network must stay possible, and HSTS would make browsers refuse it.

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 204;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    include /etc/nginx/site.inc;
}
