# Rate limits are per client IP.
# - Staff sign-in: 5/s per IP, burst 20. Password hashing is CPU heavy, so this is tight.
# - Candidate sign-in: 20/s per IP, burst 400. A whole exam room signs in at once, possibly behind one
#   public IP; guessing login codes is stopped by the backend (lockout per candidate number), not here.
# - Other API calls: 200/s per IP. Candidates save about once a second while typing, enough for a lab behind one IP;
#   this only stops a single source from taking the server down.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=candidate_login:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

# With another reverse proxy in front (e.g. the school's HTTPS proxy), Nginx sees every request as coming from it,
# so everyone shares one rate limit and the audit log shows the proxy's IP. Uncomment the two lines below
# and put the proxy's address there (trusted proxies only, or anyone can forge their source IP):
# set_real_ip_from 10.0.0.5;
# real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;          # roster files up to 5 MB
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/api/auth/(login|setup)$ {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    location = /api/candidate/login {
        limit_req zone=candidate_login burst=400 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=400 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    # Hashed static files can be cached for long; index.html is not cached so new releases apply at once.
    # Any add_header in a location stops inheriting the outer ones, so the security headers are repeated here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
