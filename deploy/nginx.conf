# 登入每個 IP 每秒 5 次（教室裡多台電腦可能共用一個對外 IP，所以 burst 給寬一點）
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;          # 名單檔案上限 5 MB
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/api/(auth|candidate)/login$ {
        limit_req zone=login burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    # 檔名帶雜湊的靜態檔可以長期快取；index.html 不快取，改版後才會立刻生效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
