# 限流以「來源 IP」計算。
# - 教職員登入：每個 IP 每秒 5 次，容許一次湧入 20 個。驗證密碼很吃 CPU，所以收得比較緊。
# - 考生登入：每個 IP 每秒 20 次，容許一次湧入 400 個。開考時整個考場會同時登入，而且可能共用一個
#   對外 IP；猜登入碼由後端擋（同一個准考證號連錯幾次就鎖定），不靠這裡。
# - 其他 API：每個 IP 每秒 200 次。考生打字時大約每秒存檔一次，整間教室共用一個對外 IP 時也夠用；
#   這一項只是防止單一來源把伺服器打掛。
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=candidate_login:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

# 前面如果還有一台反向代理（例如學校負責 HTTPS 的那台），Nginx 看到的來源全都是那台代理的 IP，
# 所有人會共用同一份限流額度，操作紀錄裡的 IP 也都是代理的。把下面兩行的註解拿掉，
# 並把 IP 換成那台代理的位址（只能填信任的代理，否則任何人都能假造來源 IP）：
# set_real_ip_from 10.0.0.5;
# real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;          # 名單檔案上限 5 MB
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    location = /api/candidate/login {
        limit_req zone=candidate_login burst=400 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=400 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy.inc;
    }

    # 檔名帶雜湊的靜態檔可以長期快取；index.html 不快取，改版後才會立刻生效。
    # 注意：location 裡只要有一個 add_header，外層的 add_header 就全部不繼承，所以安全標頭要再寫一次。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
