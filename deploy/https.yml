# HTTPS on this VM, for when there is no school reverse proxy in front. Use together with the main file:
#   docker compose -f docker-compose.prod.yml -f deploy/https.yml up -d
# Port 80 then only redirects to HTTPS. See docs/deployment.md.
services:
  web:
    ports:
      - "${TESTA_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TESTA_TLS_DIR:-./tls}:/etc/nginx/tls:ro
