# 正式部署（線上主機與教室主機用同一份）：
#   cp deploy/env.example .env   # 填好密碼
#   docker compose -f docker-compose.prod.yml up -d --build
# 對外只開 web（Nginx）。HTTPS 由學校的反向代理或負載平衡器負責；沒有的話見 docs/deployment.md。
name: testa-prod
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: testa
      POSTGRES_USER: testa
      POSTGRES_PASSWORD: ${TESTA_DB_PASSWORD:?請在 .env 設定 TESTA_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testa -d testa"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TESTA_DB_URL: jdbc:postgresql://db:5432/testa
      TESTA_DB_PASSWORD: ${TESTA_DB_PASSWORD}
      TESTA_ADMIN_EMAIL: ${TESTA_ADMIN_EMAIL:?請在 .env 設定 TESTA_ADMIN_EMAIL}
      TESTA_ADMIN_PASSWORD: ${TESTA_ADMIN_PASSWORD:?請在 .env 設定 TESTA_ADMIN_PASSWORD}
      TESTA_COOKIE_SECURE: ${TESTA_COOKIE_SECURE:-true}
      TESTA_BACKUP_PATH: /backups
      TZ: Asia/Taipei
    volumes:
      # 只讀：後台顯示備份狀態用，後端不會寫入或刪除備份
      - ${TESTA_BACKUP_DIR:-./backups}:/backups:ro

  web:
    build: ./testa
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${TESTA_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/forwarded.conf:/etc/nginx/conf.d/00-forwarded.conf:ro
      - ./deploy/proxy.inc:/etc/nginx/proxy.inc:ro

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${TESTA_DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Asia/Taipei
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${TESTA_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  db-data:
