# Production (same file for an online server and a lab server):
#   cp deploy/env.example .env   # fill in the passwords
#   docker compose -f docker-compose.prod.yml up -d --build
# Only web (Nginx) is exposed. HTTPS is handled by the school's reverse proxy or load balancer; otherwise see docs/deployment.md.
name: tpcu-testa

# Rotate container logs so a long-running server does not fill the disk
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: testa
      POSTGRES_USER: testa
      POSTGRES_PASSWORD: ${TESTA_DB_PASSWORD:?set TESTA_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testa -d testa"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      TESTA_DB_URL: jdbc:postgresql://db:5432/testa
      TESTA_DB_PASSWORD: ${TESTA_DB_PASSWORD}
      TESTA_SETUP_TOKEN: ${TESTA_SETUP_TOKEN:-}
      TESTA_COOKIE_SECURE: ${TESTA_COOKIE_SECURE:-true}
      TESTA_BACKUP_PATH: /backups
      TZ: ${TESTA_TZ:-Asia/Taipei}
    healthcheck:
      # Also checks the database connection
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    volumes:
      # Read-only: the admin pages show backup status; the backend never writes or deletes backups
      - ${TESTA_BACKUP_DIR:-./backups}:/backups:ro

  web:
    build: ./testa
    restart: unless-stopped
    logging: *logging
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "${TESTA_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/http.conf:/etc/nginx/conf.d/00-http.conf:ro
      - ./deploy/proxy.inc:/etc/nginx/proxy.inc:ro
      - ./deploy/site.inc:/etc/nginx/site.inc:ro

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${TESTA_DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TESTA_TZ:-Asia/Taipei}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${TESTA_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  db-data:
